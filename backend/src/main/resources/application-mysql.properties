server.port=8080

spring.datasource.url=jdbc:mysql://${MYSQL_HOST:localhost}:${MYSQL_PORT:3306}/${MYSQL_DATABASE:bidx_db}?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
spring.datasource.username=${MYSQL_USER:bidx}
spring.datasource.password=${MYSQL_PASSWORD:bidxpassword}
spring.datasource.driverClassName=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect
spring.jpa.show-sql=false

bidx.jwt.secret=${JWT_SECRET:BidXSecretKeyForJwtAuthenticationSuperSecret32CharsLong!}
bidx.jwt.expiration-ms=86400000
